services:
  postgres:
    image: postgres:16-alpine
    container_name: forgefit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgefit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - forgefit-postgres:/var/lib/postgresql/data

volumes:
  forgefit-postgres:
